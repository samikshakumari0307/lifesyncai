<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | LifeSync AI</title>
  <meta name="description" content="Create your free LifeSync AI account and start achieving more today.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-split-card">

      <!-- Back to Home -->
      <a href="index.html" class="floating-back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Home
      </a>

      <!-- Left: Glass panel over background image -->
      <div class="auth-image-panel">
        <h1><small>LifeSync AI</small>Join Us<br>Today</h1>
      </div>

      <!-- Right: Glass Form Panel -->
      <div class="auth-form-panel">

        <div class="auth-brand"><img src="assets/logo.png" alt="LifeSync AI" style="max-height: 40px; display: block;"></div>

        <h2>Create account</h2>
        <p class="auth-subtitle">Free forever. No credit card required.</p>

        <!-- Social -->
        <div class="auth-social">
          <button type="button" class="btn-social" id="btn-google">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.345-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"/></svg>
            Continue with Google
          </button>
          <button type="button" class="btn-social icon-only" id="btn-github" title="Continue with GitHub">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          </button>
        </div>

        <div class="auth-divider">or sign up with email</div>

        <form id="register-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="name">Full name</label>
            <input type="text" id="name" placeholder="John Doe" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password" required minlength="6">
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirm password</label>
              <input type="password" id="confirm-password" placeholder="Repeat password" autocomplete="new-password" required>
            </div>
          </div>

          <div class="auth-terms">
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
          </div>

          <p id="error-message" class="error-message"></p>

          <button type="submit" class="btn-auth-submit" id="register-btn">Create Account</button>
        </form>

        <div class="auth-bottom-links">
          Already have an account? <a href="login.html">Sign In →</a>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
